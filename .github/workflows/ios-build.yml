name: Fielens iOS Build

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fielens-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile iOS without signing
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode 26.6 is installed
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Compile Fielens for iOS device (no signing)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "apps/ios/Fielens/Fielens.xcodeproj" \
            -scheme Fielens \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/FielensBuild" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build 2>&1 | tee "$RUNNER_TEMP/fielens-build.log"

      - name: Upload build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fielens-ios-build-log
          path: ${{ runner.temp }}/fielens-build.log
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: Swift unit tests on iOS simulator
    needs: compile
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify simulator environment
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run unit tests without UI automation
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "apps/ios/Fielens/Fielens.xcodeproj" \
            -scheme Fielens \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -derivedDataPath "$RUNNER_TEMP/FielensTests" \
            -parallel-testing-enabled NO \
            -only-testing:FielensTests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet test 2>&1 | tee "$RUNNER_TEMP/fielens-unit-tests.log"

      - name: Upload unit-test log if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fielens-ios-unit-test-log
          path: ${{ runner.temp }}/fielens-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7
